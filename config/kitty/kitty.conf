# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# NOTHING-SHELL look: Lettera Mono, the static Nothing palette from kitty-themes/01-Wallust.conf
# (no local colour overrides any more), white selection, pill tabs.
# Original: ~/.config/nothing-shell-backup/2026-09-13/kitty/kitty.conf

# you can choose themes from $HOME/.config/kitty/kitty-themes/
include ./kitty-themes/00-Default.conf

font_family      Lettera Mono LL
bold_font        Lettera Mono LL Medium
italic_font      Lettera Mono LL Italic
bold_italic_font Lettera Mono LL Medium Italic
font_size 14
# Lettera Mono's fi/fl ligatures (the `liga` feature) span two cells and leave a visible gap.
# disable_ligatures doesn't reach windows that are already open on reload; font_features does.
disable_ligatures always
font_features LetteraMonoLL-Regular      -liga
font_features LetteraMonoLL-Medium       -liga
font_features LetteraMonoLL-Italic       -liga
font_features LetteraMonoLL-MediumItalic -liga

background_opacity 0.9
dynamic_background_opacity 1
confirm_os_window_close 0

# Animated cursor
cursor_trail 1

# change to x11 or wayland or leave auto
linux_display_server auto

scrollback_lines 2000
wheel_scroll_min_lines 1

enable_audio_bell no

window_padding_width 10

selection_foreground #000000
selection_background #FFFFFF

tab_bar_style powerline
tab_powerline_style round
