; cava settings for the glyph lights' music mode (GlyphService.qml reads this).
; Four mono bands, bass to treble, printed as "a;b;c;d;" lines scaled 0-100.

[general]
bars = 4
framerate = 30
autosens = 1

[input]
; Fedora's cava has no pipewire input; PipeWire serves the pulse API too.
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 60
