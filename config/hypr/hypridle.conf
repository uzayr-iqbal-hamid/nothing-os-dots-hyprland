# NOTHING-SHELL: idle chain. 5 min dim, 10 min lock, 11 min screens off, 30 min suspend on battery.
# The shell's caffeine tile (Wayland idle-inhibit) and media players' D-Bus inhibits pause the
# whole chain. KooL upgrades may replace this file: copy in ~/.config/nothing-shell-backup/.

$UserScripts = $HOME/.config/hypr/UserScripts

general {
    lock_cmd = pidof hyprlock || hyprlock       # always run for "loginctl lock-session"
    before_sleep_cmd = loginctl lock-session    # locked before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # screens back on after resume
    ignore_dbus_inhibit = false                 # browsers/players playing media keep the session awake
}

# 5 min: dim the laptop panel and switch the keyboard backlight off; both restored on activity
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10% && brightnessctl -sd dell::kbd_backlight set 0
    on-resume = brightnessctl -r && brightnessctl -rd dell::kbd_backlight
}

# 10 min: lock
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 11 min: all screens off, back on with activity
listener {
    timeout = 660
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# 30 min: suspend, but only on battery
listener {
    timeout = 1800
    on-timeout = $UserScripts/IdleSuspend.sh
}
