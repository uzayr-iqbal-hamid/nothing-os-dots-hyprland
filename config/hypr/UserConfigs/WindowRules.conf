# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# For window rules and layerrules
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more

# This file is used to add or overwrite window rules
# This file will not be modified during dotfiles updates

# Frosted-glass waybar: blur the desktop behind the translucent bar.
# ignore_alpha keeps the fully-transparent rounded corners from showing a blurred square.
layerrule = match:namespace waybar, blur on
layerrule = match:namespace waybar, ignore_alpha 0.2

# Nothing shell: frosted translucent desktop widgets (Theme.widget, alpha 0.35),
# dock and control center (Theme.glass, alpha 0.6).
# ignore_alpha keeps the transparent parts of each surface (gaps between tiles, the clock's empty
# box, the dock's full-width strip) unblurred. The widgets sit on the wallpaper, so they keep the
# global xray; the dock and control center float over windows, so they blur what's really behind.
layerrule = match:namespace nothing-widgets, blur on
layerrule = match:namespace nothing-widgets, ignore_alpha 0.2
layerrule = match:namespace nothing-dock, blur on
layerrule = match:namespace nothing-dock, ignore_alpha 0.3
layerrule = match:namespace nothing-dock, xray off
layerrule = match:namespace nothing-controlcenter, blur on
layerrule = match:namespace nothing-controlcenter, ignore_alpha 0.3
layerrule = match:namespace nothing-controlcenter, xray off

# Wispr Flow status indicator (the mic pill).
# The window is a 440x320 mostly-transparent canvas with a small pill drawn inside it.
# Blur + shadow + border + rounding paint that empty canvas as a visible frosted box,
# which is the "big box" — the pill itself is already small.
# no_focus keeps it from stealing focus away from the field you're dictating into.
windowrule = match:class ^(wispr-flow)$ match:title ^(Status)$, float on, no_blur on, no_shadow on, border_size 0, rounding 0, no_dim on, opacity 1.0 1.0, no_focus on, no_initial_focus on, animation none

# NOTHING-SHELL: motion for layer surfaces. The shell's control center and dock animate
# themselves in QML, so Hyprland must not add a second animation on map/unmap.
layerrule = match:namespace nothing-controlcenter, no_anim on
layerrule = match:namespace nothing-dock, no_anim on
layerrule = match:namespace rofi, animation popin 90%
layerrule = match:namespace swaync-notification-window, animation slide top
layerrule = match:namespace swaync-control-center, animation slide right

# NOTHING-SHELL: OSD pill and power menu (both glass over blur; the power menu fades itself in QML)
layerrule = match:namespace nothing-osd, blur on
layerrule = match:namespace nothing-osd, ignore_alpha 0.3
layerrule = match:namespace nothing-osd, xray off
layerrule = match:namespace nothing-powermenu, blur on
layerrule = match:namespace nothing-powermenu, xray off
layerrule = match:namespace nothing-powermenu, no_anim on
