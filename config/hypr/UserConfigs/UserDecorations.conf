# Decoration Settings
# NOTHING-SHELL look: hairline white focus border, 16px corners, soft black shadow instead of the red glow.
# Original: ~/.config/nothing-shell-backup/2026-09-13/hypr/UserConfigs/UserDecorations.conf

# Hyprland Wiki Links
# Animation - https://wiki.hyprland.org/Configuring/Animations/
# Decoration - https://wiki.hyprland.org/Configuring/Variables/#decoration

# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

general {
  border_size = 1
  gaps_in = 7
  gaps_out = 5, 14, 14, 14   # top, right, bottom, left — smaller top gap = windows sit closer to the bar

  col.active_border = rgba(ffffff99)
  col.inactive_border = rgba(2e2e2eff)
}

decoration {
  rounding = 16

  active_opacity = 1.0
  inactive_opacity = 0.9
  fullscreen_opacity = 1.0

  dim_inactive = true
  dim_strength = 0.1
  dim_special = 0.8

  shadow {
    enabled = true
    range = 12
    render_power = 3

    color = rgba(000000aa)
    color_inactive = rgba(00000066)
  }

  blur {
    enabled = true
    size = 6
    passes = 3
    new_optimizations = true
    xray = true
    ignore_opacity = true
    special = true
    popups = true
  }
}

group {
  col.border_active = rgba(ffffff99)
  col.border_inactive = rgba(2e2e2eff)

	groupbar {
    font_family = Lettera Mono LL
    text_color = rgba(ffffffff)
		col.active = rgba(242424ff)
    col.inactive = rgba(0d0d0dff)
  }
}
