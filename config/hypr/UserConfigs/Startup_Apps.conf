# Commands and Apps to be executed at launch

# Start xdg-desktop-portal manually. Auto-start via D-Bus/systemd fails here because
# Hyprland isn't wired into graphical-session.target, so the portal's dependency never
# activates. This runs JaKooLit's own portal-starter (needed for OBS PipeWire capture).
exec-once = $scriptsDir/PortalHyprland.sh

# Nothing OS shell (Quickshell, ~/.config/quickshell/nothing): the top bar for now.
# Replaces waybar, whose exec-once is commented out in configs/Startup_Apps.conf.
exec-once = qs -c nothing

