# User Settings
# This is where you put your own settings as this will not be touched during update 
# if the upgrade.sh is used.

# refer to Hyprland wiki for more info https://wiki.hyprland.org/Configuring/Variables/
# NOTE: some settings are in ~/.config/hypr/UserConfigs/UserDecorAnimations.conf
#
# Look on ~/.config/hypr/configs/SystemSettings.conf to know how to modify this

# 3-finger swipe up ran KooL's scripts/OverviewToggle.sh, which checks for a "quickshell" process
# (it runs as "qs") and so launched a new overview on every swipe. Point it at the IPC-based user script.
gestures {
  gesture = 3, up, unset
  gesture = 3, up, dispatcher, exec, $UserScripts/OverviewToggle.sh

  # 3-finger swipe down opens the Nothing shell control center on the focused monitor
  gesture = 3, down, dispatcher, exec, qs ipc -c nothing call controlcenter open
}


# NOTHING-SHELL: Hyprland's own font (ANR dialog, error bar) matches the shell's label font
misc {
  font_family = Lettera Mono LL
}
