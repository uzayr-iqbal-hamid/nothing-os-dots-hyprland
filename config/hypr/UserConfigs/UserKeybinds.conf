# /* ---- 💫 https://github.com/JaKooLit 💫 ---- */  #
# This is where you put your own keybinds. Be Mindful to check as well ~/.config/hypr/configs/Keybinds.conf to avoid conflict
# if you think I should replace the Pre-defined Keybinds in ~/.config/hypr/configs/Keybinds.conf , submit an issue or let me know in DC and present me a valid reason as to why, such as conflicting with global shortcuts, etc etc

# See https://wiki.hyprland.org/Configuring/Keywords/ for more settings and variables
# See also Laptops.conf for laptops keybinds 

# /* ---- ✴️ Variables ✴️ ---- */  #
$mainMod = SUPER
$scriptsDir = $HOME/.config/hypr/scripts
$UserScripts = $HOME/.config/hypr/UserScripts
$UserConfigs = $HOME/.config/hypr/UserConfigs

#  IMPORTANT: If you want to remap and existing keybind you MUST unbindd it first 

# The bindings are CASE SENSITIVE. We suggest you copy the exisitng binding here
#  Then change `bindd` to `unbind`

# E.g. 
# unbind = $mainMod, Return, Open terminal, exec, $term
# bindd = $mainMod, Return, Open terminal, exec, ghostty 
#
# unbind = $mainMod, E, file manager, exec, $files
# bindd = $mainMod, T, file manager, exec, $files

# If you are ADDING a bindd, make sure you include the description 
# Other the keybind search menu might not show it properly 

# E.g.
# bindd = $mainMod, Z, My z app, exec APPNAME









# Open Obsidian (Flatpak)
bindd = $mainMod, O, Open Obsidian, exec, flatpak run md.obsidian.Obsidian

# Open Zed code editor
bindd = $mainMod, Z, Open Zed, exec, $HOME/.local/zed.app/bin/zed

# Open Google Chrome (Flatpak)
bindd = $mainMod, C, Open Google Chrome, exec, flatpak run com.google.Chrome

# Overview: KooL's toggle checks for a "quickshell" process, but it runs as "qs",
# so each press spawned another overview instance. Use the IPC-based user script instead.
unbind = $mainMod, A
bindd = $mainMod, A, desktop overview, exec, $UserScripts/OverviewToggle.sh

# For passthrough keyboard into a VM
# bind = $mainMod ALT, P, submap, passthru
#submap = passthru
# to unbind
#bind = $mainMod ALT, P, submap, reset
#submap = reset

# NOTHING-SHELL: media keys go through the shell's OSD instead of KooL's notify-send popups
unbind = , xf86audioraisevolume
unbind = , xf86audiolowervolume
unbind = ALT, xf86audioraisevolume
unbind = ALT, xf86audiolowervolume
unbind = , xf86audiomute
unbind = , xf86AudioMicMute
unbind = , xf86MonBrightnessUp
unbind = , xf86MonBrightnessDown
bindeld = , xf86audioraisevolume, volume up, exec, $UserScripts/Volume.sh --inc
bindeld = , xf86audiolowervolume, volume down, exec, $UserScripts/Volume.sh --dec
bindeld = ALT, xf86audioraisevolume, volume up precise, exec, $UserScripts/Volume.sh --inc-precise
bindeld = ALT, xf86audiolowervolume, volume down precise, exec, $UserScripts/Volume.sh --dec-precise
bindld = , xf86audiomute, toggle mute, exec, $UserScripts/Volume.sh --toggle
bindld = , xf86AudioMicMute, toggle mic mute, exec, $UserScripts/Volume.sh --toggle-mic
bindeld = , xf86MonBrightnessUp, brightness up, exec, $UserScripts/Brightness.sh --inc
bindeld = , xf86MonBrightnessDown, brightness down, exec, $UserScripts/Brightness.sh --dec

# NOTHING-SHELL: the shell's power menu replaces wlogout; Super+D opens the app grid
unbind = CTRL ALT, P
bindd = CTRL ALT, P, power menu, exec, qs ipc -c nothing call powermenu toggle
unbind = $mainMod, D
bindd = $mainMod, D, app launcher, exec, pkill rofi || rofi -show drun -theme ~/.config/rofi/nothing-grid.rasi
