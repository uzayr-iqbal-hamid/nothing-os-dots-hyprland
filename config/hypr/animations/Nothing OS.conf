# NOTHING-SHELL: Nothing OS motion. Quick, decelerating curves with no overshoot or bounce:
# windows scale in and out (like apps on the phone), workspaces slide, layers and popups fade.
# Speeds are in 100 ms units. KooL's "Animations" menu overwrites this file with a preset from
# ~/.config/hypr/animations/, where "Nothing OS.conf" is a copy of this one.
animations {
  enabled = yes

  bezier = nothingOut, 0.22, 1, 0.36, 1     # ease-out quint: fast start, soft landing
  bezier = nothingExpo, 0.16, 1, 0.3, 1     # ease-out expo: snappier, for exits and layers
  bezier = linear, 0, 0, 1, 1

  animation = global, 1, 2, nothingOut
  animation = windows, 1, 2.5, nothingOut, popin 90%
  animation = windowsIn, 1, 2.5, nothingOut, popin 90%
  animation = windowsOut, 1, 1.8, nothingExpo, popin 90%
  animation = windowsMove, 1, 2.5, nothingOut
  animation = layers, 1, 1.8, nothingExpo, fade
  animation = layersIn, 1, 1.8, nothingExpo, fade
  animation = layersOut, 1, 1.5, nothingExpo, fade
  animation = fade, 1, 2, nothingOut
  animation = fadeLayers, 1, 1.8, nothingExpo
  animation = fadePopups, 1, 1.5, nothingExpo
  animation = border, 1, 1.5, linear
  animation = borderangle, 0                # no looping border animation (integrated GPU)
  animation = workspaces, 1, 3, nothingOut, slide
  animation = specialWorkspace, 1, 2.5, nothingOut, slidefadevert 15%
  animation = zoomFactor, 1, 3, nothingOut
}
