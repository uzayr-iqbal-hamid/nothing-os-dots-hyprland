# NOTHING-SHELL: Nothing OS lock screen. Darkened wallpaper, dot-matrix clock, spaced uppercase date,
# black pill password field that turns red on failure, battery and weather in the bottom corners.
# KooL's original: ~/.config/nothing-shell-backup/2026-09-13/hypr/hyprlock.conf
# (KooL upgrades may overwrite this file: grep -rn NOTHING-SHELL ~/.config/hypr)

$Scripts = $HOME/.config/hypr/scripts

general {
    fractional_scaling = 2
    immediate_render = true
    hide_cursor = true
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper_effects/.wallpaper_current
    color = rgb(000000) # shown until the wallpaper loads

    blur_size = 4
    blur_passes = 2
    noise = 0.02
    contrast = 1.0
    brightness = 0.45
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "<span letter_spacing='2048'>$(date +'%A, %-d %B' | tr '[:lower:]' '[:upper:]')</span>"
    color = rgba(8C8C8CFF)
    font_size = 13
    font_family = Lettera Mono LL
    position = 0, 205
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(FFFFFFFF)
    font_size = 128
    # trailing comma matters: Pango reads "Ndot 57" as family "Ndot" at size 57 and falls back
    font_family = Ndot 57,
    position = 0, 100
    halign = center
    valign = center
}

# Password
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 1
    rounding = -1
    dots_size = 0.2
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(2E2E2EFF)
    inner_color = rgba(000000CC)
    font_color = rgba(FFFFFFFF)
    font_family = Lettera Mono LL
    check_color = rgba(8C8C8CFF)
    fail_color = rgba(D71921FF)
    capslock_color = rgba(D71921FF)
    fade_on_empty = false
    hide_input = false
    placeholder_text = <span foreground="##5A5A5A" letter_spacing="1024">ENTER PASSWORD</span>
    fail_text = <span foreground="##D71921" letter_spacing="1024">$FAIL</span>
    position = 0, -90
    halign = center
    valign = center
}

# Battery
label {
    monitor =
    text = cmd[update:30000] echo "$($Scripts/Battery.sh)"
    color = rgba(8C8C8CFF)
    font_size = 11
    font_family = Lettera Mono LL
    position = -32, 28
    halign = right
    valign = bottom
}

# Weather (cache written by KooL's weather script before locking)
label {
    monitor =
    text = cmd[update:3600000] [ -f "$HOME/.cache/.weather_cache" ] && cat "$HOME/.cache/.weather_cache"
    color = rgba(8C8C8CFF)
    font_size = 11
    font_family = Lettera Mono LL
    position = 32, 28
    halign = left
    valign = bottom
}
